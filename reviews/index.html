<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="../assets/images/fiber.webp">
    <link rel="shortcut icon" href="../assets/images/fiber.webp">
    <title>آراء وتقييمات العملاء في السعودية | تجارب الفايبر و 5G | Fiber 5G</title>
    <meta name="description"
        content="استعرض كافة آراء وتجارب المشتركين الحقيقيين لخدمات إنترنت الفايبر والـ 5G في كافة مدن ومناطق المملكة العربية السعودية والمنطقة السعودية. عروض وتأسيس شركات STC, سلام, موبايلي, وزين.">

    <link rel="canonical" href="https://fiber-5g-internet.com/reviews/index.html">
    <meta name="geo.region" content="SA">
    <meta name="geo.placename" content="المملكة العربية السعودية, Saudi Arabia">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="آراء وتقييمات العملاء في السعودية | تجارب الفايبر و 5G | Fiber 5G">
    <meta property="og:description" content="استعرض كافة آراء وتجارب المشتركين الحقيقيين لخدمات إنترنت الفايبر والـ 5G في كافة مدن ومناطق المملكة العربية السعودية.">
    <meta property="og:image" content="https://fiber-5g-internet.com/assets/images/fiber.webp">
    <meta property="og:url" content="https://fiber-5g-internet.com/reviews/index.html">
    <meta name="twitter:card" content="summary_large_image">

    <!-- CSS Style & Fonts & FontAwesome -->
    <link rel="stylesheet" href="../assets/fontawesome/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "آراء وتقييمات باقات الفايبر والـ 5G بالسعودية",
        "image": "https://fiber-5g-internet.com/assets/images/fiber.webp",
        "description": "تجارب وآراء عملاء تأسيس الفايبر والجيل الخامس 5G لشركات الاتصالات بالسعودية.",
        "brand": {
            "@type": "Brand",
            "name": "Fiber 5G"
        },
        "aggregateRating": {
            "@type": "AggregateRating",
            "ratingValue": "4.94",
            "bestRating": "5",
            "worstRating": "1",
            "ratingCount": "380",
            "reviewCount": "350"
        },
        "offers": {
            "@type": "AggregateOffer",
            "priceCurrency": "SAR",
            "lowPrice": "230",
            "highPrice": "402.5",
            "offerCount": "12",
            "priceValidUntil": "2027-12-31",
            "availability": "https://schema.org/InStock"
        }
    }
    </script>

    <!-- Inline dark mode check -->
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>

<body
    class="bg-gray-50 text-gray-900 dark:bg-slate-950 dark:text-gray-100 transition-colors duration-300 antialiased font-sans min-h-screen">

    <!-- Global Header Navbar Container -->
    <div id="global-header"></div>

    <!-- Main Content Container -->
    <main class="pt-28 pb-20 lg:pt-36 lg:pb-28 relative overflow-hidden">

        <!-- Ambient Glow Backgrounds -->
        <div
            class="absolute top-1/4 right-10 w-96 h-96 bg-blue-600/10 dark:bg-blue-500/15 rounded-full blur-3xl pointer-events-none">
        </div>
        <div
            class="absolute bottom-10 left-10 w-96 h-96 bg-sky-500/10 dark:bg-cyan-500/10 rounded-full blur-3xl pointer-events-none">
        </div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 space-y-12">

            <!-- Page Header -->
            <div class="text-center max-w-3xl mx-auto space-y-4">
                <div
                    class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-blue-50 dark:bg-blue-950/60 border-r-4 border-r-blue-600 border-t border-b border-l border-blue-200/60 dark:border-blue-800/60 text-blue-700 dark:text-sky-300 text-xs sm:text-sm font-extrabold shadow-sm">
                    <i class="fa-solid fa-comments text-blue-600 dark:text-sky-400"></i>
                    <span>جميع آراء وتقييمات العملاء</span>
                </div>

                <h1
                    class="text-3xl sm:text-4xl lg:text-5xl font-black text-slate-900 dark:text-white leading-tight tracking-tight">
                    تجارب مشتركينا الحقيقية <span
                        class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 via-sky-500 to-cyan-400">في
                        المملكة العربية السعودية</span>
                </h1>

                <p class="text-slate-600 dark:text-slate-300 text-base sm:text-lg font-normal leading-relaxed">
                    تصفح جميع تقييمات العملاء لخدمات التأسيس والسرعات لشركات STC، سلام، موبايلي، وزين، وشاركنا تجربتك
                    الخاصة!
                </p>
            </div>

            <!-- Reviews Submission Form -->
            <div
                class="max-w-3xl mx-auto bg-white dark:bg-slate-900 rounded-3xl p-8 sm:p-10 border border-slate-200/80 dark:border-slate-800 shadow-xl space-y-6 text-right">
                <div class="flex items-center gap-3 pb-4 border-b border-slate-100 dark:border-slate-800">
                    <div
                        class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center text-lg shadow-md">
                        <i class="fa-solid fa-pen-to-square"></i>
                    </div>
                    <div>
                        <h3 class="text-xl font-black text-slate-900 dark:text-white">أضف تقييمك وتجربتك بالخدمة</h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400">تقييمك يظهر فوراً ويساعد زوارنا في السعودية
                            على اختيار الخدمة الأفضل</p>
                    </div>
                </div>

                <form id="add-review-form" class="space-y-5">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">اسمك الكامل
                                *</label>
                            <input type="text" id="review-name" required placeholder="مثال: عبدالمجيد الدوسري"
                                class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:border-blue-600 transition-colors">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">المنطقة /
                                الحي *</label>
                            <input type="text" id="review-city" required placeholder="مثال: الرياض - حي النخيل"
                                class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:border-blue-600 transition-colors">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">المشغل /
                                الباقة *</label>
                            <select id="review-provider"
                                class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:border-blue-600 transition-colors">
                                <option value="STC بيتي فايبر">STC بيتي فايبر</option>
                                <option value="سلام فايبر Salam">سلام فايبر Salam</option>
                                <option value="موبايلي 5G لاسلكي">موبايلي 5G لاسلكي</option>
                                <option value="موبايلي فايبر مفوتر">موبايلي فايبر مفوتر</option>
                                <option value="زين 5G منزلي">زين 5G منزلي</option>
                                <option value="زين فايبر Zain">زين فايبر Zain</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">تقييمك
                                (بالنجوم) *</label>
                            <div id="star-rating-selector"
                                class="flex items-center gap-2 pt-2 text-2xl text-slate-300 cursor-pointer">
                                <i class="fa-solid fa-star star-icon text-amber-400" data-value="1"></i>
                                <i class="fa-solid fa-star star-icon text-amber-400" data-value="2"></i>
                                <i class="fa-solid fa-star star-icon text-amber-400" data-value="3"></i>
                                <i class="fa-solid fa-star star-icon text-amber-400" data-value="4"></i>
                                <i class="fa-solid fa-star star-icon text-amber-400" data-value="5"></i>
                                <span id="rating-number" class="text-xs font-bold text-slate-500 mr-2">5 من 5</span>
                            </div>
                            <input type="hidden" id="review-rating" value="5">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">تفاصيل تعليقك
                            وتجربتك *</label>
                        <textarea id="review-comment" required rows="3"
                            placeholder="اكتب تفاصيل تجربتك مع التأسيس والسرعة والمعاملة..."
                            class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white text-sm focus:outline-none focus:border-blue-600 transition-colors"></textarea>
                    </div>

                    <div id="review-alert" class="hidden p-3 rounded-xl text-xs font-bold text-center"></div>

                    <button type="submit" id="submit-review-btn"
                        class="w-full py-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-black text-sm shadow-lg shadow-blue-600/30 transition-all duration-300 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>إرسال وتوثيق التقييم</span>
                    </button>
                </form>
            </div>

            <!-- Reviews Container Grid (Dynamically Populated) -->
            <div id="reviews-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 pt-4"></div>

        </div>
    </main>

    <!-- Global Floating Actions Container -->
    <div id="global-floating-stack"></div>

    <!-- JavaScript Files -->
    <script src="../assets/js/layout.js" defer></script>
    <script src="../assets/js/main.js" defer></script>
</body>

</html>
